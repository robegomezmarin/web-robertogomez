<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>robertogomez-fotografía</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{height:100vh;width:100vw;background:#fff;color:#000;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:300;overflow:hidden;position:relative;}
.line{position:absolute;top:0;bottom:14%;left:18%;width:1px;background:rgba(0,0,0,0.55);}
.name{position:absolute;top:12%;right:8%;text-align:right;font-size:clamp(20px,2.6vw,30px);letter-spacing:1px;}
.role{position:absolute;top:calc(12% + 40px);right:8%;text-align:right;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#666;}
.photo{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);max-width:52vw;max-height:72vh;width:auto;height:auto;box-shadow:0 10px 30px rgba(0,0,0,.12);}
nav{position:absolute;bottom:14%;left:8%;}
nav a{display:block;color:#8a8a8a;text-decoration:none;font-size:15px;letter-spacing:1.5px;text-transform:lowercase;margin-top:16px;}
</style></head>
<body>
<div class="line"></div>
<div class="name">Roberto Gómez</div>
<div class="role">Fotografía</div>
<img class="photo" src="foto-portada.jpg" alt="Roberto Gómez">
<nav><a href="/galeria/">galería</a><a href="#">contacto</a></nav>
</body></html>
