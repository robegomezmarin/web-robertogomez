<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Galería — Roberto Gómez</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{height:100vh;width:100vw;background:#fff;color:#000;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:300;overflow:hidden;position:relative;}
.line{position:absolute;top:0;bottom:16%;left:20%;width:1px;background:rgba(0,0,0,0.55);}
.name{position:absolute;top:12%;left:8%;font-size:clamp(15px,1.8vw,19px);letter-spacing:0.5px;}
.role{position:absolute;top:calc(12% + 28px);left:8%;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#666;}
.back{position:absolute;top:12%;right:8%;}
.back a{color:#8a8a8a;text-decoration:none;font-size:13px;letter-spacing:1.5px;text-transform:lowercase;}
.back a:hover{color:#000;}
.projects{position:absolute;bottom:16%;left:8%;}
.projects a{display:block;color:#8a8a8a;text-decoration:none;font-size:15px;letter-spacing:1.5px;font-weight:300;text-transform:lowercase;margin-top:14px;}
.projects a:hover{color:#000;}
</style></head>
<body>
<div class="line"></div>
<div class="name">Roberto Gómez</div>
<div class="role">Fotografía</div>
<div class="back"><a href="/">volver</a></div>
<div class="projects">
  <a href="/roma/">roma</a>
  <a href="/chipiona/">chipiona</a>
</div>
</body></html>
